<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日国际新闻简报 - {{DATE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            padding: 30px 20px;
            color: #333;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 36px 36px 28px;
            text-align: center;
        }
        .header .icon {
            font-size: 36px;
            margin-bottom: 10px;
            display: block;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .header .subtitle {
            font-size: 13px;
            opacity: 0.75;
            letter-spacing: 2px;
        }
        .header .date-badge {
            display: inline-block;
            background: rgba(255,255,255,0.12);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 28px 36px 20px;
        }
        .summary-box {
            background: linear-gradient(135deg, #f8f9ff 0%, #eef1ff 100%);
            border-left: 4px solid #0f3460;
            border-radius: 0 8px 8px 0;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .summary-box p {
            font-size: 13px;
            line-height: 1.8;
            color: #444;
        }
        .summary-box .label {
            font-size: 11px;
            color: #0f3460;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .article-card {
            background: #fafbfc;
            border: 1px solid #eef0f2;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            transition: box-shadow 0.2s;
        }
        .article-card:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .article-card .title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .article-card .meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }
        .article-card .meta .source {
            display: inline-block;
            background: #e8ecf1;
            padding: 1px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: #555;
        }
        .article-card .summary {
            font-size: 14px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 10px;
        }
        .article-card .read-more {
            display: inline-block;
            font-size: 12px;
            color: #0f3460;
            text-decoration: none;
            font-weight: 500;
        }
        .article-card .read-more:hover {
            text-decoration: underline;
        }
        .content h2 {
            font-size: 14px;
            color: #0f3460;
            font-weight: 600;
            margin: 28px 0 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8ecf1;
            letter-spacing: 0.5px;
        }
        .content h2:first-of-type {
            margin-top: 0;
        }
        .content h3 {
            font-size: 15px;
            color: #1a1a2e;
            margin: 20px 0 8px;
        }
        .content p {
            font-size: 14px;
            line-height: 1.8;
            color: #555;
            margin: 8px 0;
        }
        .content ul, .content ol {
            margin: 8px 0 16px 20px;
        }
        .content li {
            font-size: 14px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 4px;
        }
        .content blockquote {
            border-left: 3px solid #0f3460;
            padding: 10px 16px;
            margin: 12px 0;
            background: #f8f9ff;
            border-radius: 0 6px 6px 0;
            color: #555;
            font-size: 14px;
            line-height: 1.7;
        }
        .content a {
            color: #0f3460;
            text-decoration: none;
        }
        .content a:hover {
            text-decoration: underline;
        }
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #e0e0e0, transparent);
            margin: 24px 0;
        }
        .footer {
            padding: 24px 36px 28px;
            text-align: center;
            background: #f8f9fa;
        }
        .footer p {
            font-size: 11px;
            color: #aaa;
            line-height: 1.8;
        }
        .footer .brand {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        .footer .brand strong {
            color: #0f3460;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="icon">&#x1F30D;</span>
            <h1>每日国际新闻简报</h1>
            <div class="subtitle">AI 智能筛选 精选国际要闻</div>
            <div class="date-badge">{{DATE}}</div>
        </div>
        <div class="content">
            {{CONTENT}}
        </div>
        <div class="divider"></div>
        <div class="footer">
            <p>本简报由 News Agent 自动化工作流系统每日自动生成</p>
            <p class="brand">Powered by <strong>AI</strong> + DeepSeek</p>
        </div>
    </div>
</body>
</html>
